[package]
name = "elise-pet"
version = "0.1.0"
description = "Elise desktop pet"
authors = ["Elise-pet contributors"]
edition = "2021"

[lib]
name = "elise_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "vendored", "crypto-rust"] }
natord = "1"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tempfile = "3"
