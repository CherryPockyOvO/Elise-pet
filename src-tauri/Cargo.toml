[package]
name = "elise-pet"
version = "0.1.0"
description = "Elise desktop pet"
authors = ["Elise-pet contributors"]
edition = "2021"

[lib]
name = "elise_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
